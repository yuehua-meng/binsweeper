name: Bug report
description: 报告一个问题，帮助 BinSweeper 变得更稳。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。涉及删除、恢复、待清理区的问题，请尽量附上复现步骤和失败提示。
  - type: input
    id: version
    attributes:
      label: BinSweeper 版本
      description: 界面标题栏版本 / Release 文件名 / commit hash
      placeholder: "例如 v0.1.0 或 commit 3f2a1c9"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows 版本
      placeholder: "例如 Windows 11 23H2 (22631)"
    validations:
      required: true
  - type: input
    id: scale
    attributes:
      label: 回收站规模
      description: 大致条目数或占用空间，方便判断是否与性能相关
      placeholder: "例如 20 万条目 / 300 GB"
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 BinSweeper
        2. 点击「扫描」
        3. ……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有截图或错误文本更好
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 其他信息
      description: 日志、系统语言、是否开启自动清理等
